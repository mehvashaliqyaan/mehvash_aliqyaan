<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Host dashboard | Mehvash &amp; Aliqyaan RSVPs</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#3d2b1f;--muted:#7a604c;--maroon:#7e0f2b;--paper:#f7f1e8;--card:#fffdf9;--line:#e6d8c3;--yes:#24633e;--no:#9d2533}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 Montserrat,system-ui,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:28px 14px 60px}
  h1{font:700 clamp(28px,6vw,36px)/1.1 "Cormorant Garamond",serif;margin:0 0 4px;text-align:center}
  .sub{text-align:center;color:var(--muted);margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(61,43,31,.06)}
  form.login{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  input,button,select{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 12px;min-width:0}
  button{background:var(--ink);color:#fff;border:0;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:20px;text-align:center;font-size:13px}.msg.error{color:var(--no);line-height:1.6}
  .tabs{display:flex;gap:6px;justify-content:center;margin:0 0 16px;flex-wrap:wrap}
  .tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:9px 18px}
  .tabs button[aria-selected="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .tabs small{display:block;font-weight:400;font-size:11px;opacity:.8}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font:700 30px/1.1 "Cormorant Garamond",serif}
  .stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .toolbar input{flex:1 1 180px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;white-space:nowrap}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .pill.Yes{background:#e3f1e8;color:var(--yes)}.pill.No{background:#f7e3e5;color:var(--no)}
  .empty{text-align:center;color:var(--muted);padding:26px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Guest RSVPs</h1>
  <p class="sub">Mehvash &amp; Aliqyaan · Host dashboard</p>

  <section id="loginBox" class="card">
    <form class="login" id="loginForm">
      <label for="hostKey">Host key</label>
      <input id="hostKey" type="password" autocomplete="current-password" required placeholder="The HOST_KEY you set in Apps Script"/>
      <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="remember" style="width:auto;padding:0"/> Remember on this device</label>
      <button type="submit" id="loginBtn">Show guest lists</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-event="reception" aria-selected="true">Reception<small>wedding.html · Fri 18 Dec</small></button>
      <button type="button" role="tab" data-event="mehvash_raju" aria-selected="false">Mehvash &amp; Raju<small>Reception · Fri 18 Dec</small></button>
      <button type="button" role="tab" data-event="mehendi" aria-selected="false">Mehendi<small>Thu 17 Dec</small></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search name…"/>
        <select id="filter"><option value="">All</option><option value="Yes">Attending</option><option value="No">Declined</option></select>
        <button class="ghost" id="refresh" type="button">Refresh</button>
        <button class="ghost" id="csv" type="button">Download CSV</button>
        <a id="sheetLink" hidden target="_blank" rel="noopener"><button class="ghost" type="button">Open Google Sheet</button></a>
        <button class="ghost" id="logout" type="button">Log out</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="msg" id="dashMsg"></p>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script>
(() => {
'use strict';
const endpoint = String(window.WEDDING_RSVP_ENDPOINT || '').trim();
const $ = id => document.getElementById(id);
const KEY_STORE = 'weddingHostKey';
const COLUMNS = {
  reception: [['receivedAt','Received'],['name','Name'],['attending','Attending'],['guests','Guests',1]],
  mehvash_raju: [['receivedAt','Received'],['name','Name'],['attending','Attending'],['guests','Guests',1]],
  mehendi:   [['receivedAt','Received'],['name','Name'],['attending','Attending'],['ladies','Ladies',1],['gents','Gents',1],['guests','Total',1]]
};
const cache = {};
const EVENTS = Object.keys(COLUMNS);
let current = EVENTS.includes(new URLSearchParams(location.search).get('event')) ? new URLSearchParams(location.search).get('event') : 'reception';
let sortKey = 'receivedAt', sortDir = -1, hostKey = '';

if (window.WEDDING_HOST_SHEET_URL) { $('sheetLink').href = window.WEDDING_HOST_SHEET_URL; $('sheetLink').hidden = false; }

function jsonp(params, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = 'weddingHost_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script'); let done = false;
    const end = () => { if (done) return; done = true; clearTimeout(t); s.remove(); try { delete window[cb]; } catch (_) { window[cb] = undefined; } };
    const t = setTimeout(() => { end(); reject(new Error('The RSVP service did not answer. Check the /exec link in js/config.js and that the Web app access is "Anyone".')); }, timeoutMs);
    window[cb] = d => { end(); resolve(d); };
    s.onerror = () => { end(); reject(new Error('Could not reach the RSVP service.')); };
    const u = new URL(endpoint);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    u.searchParams.set('callback', cb); u.searchParams.set('_', Date.now());
    s.src = u.toString(); document.head.appendChild(s);
  });
}

async function load(event, key) {
  const res = await jsonp({ action: 'list', event, key });
  if (!res || !res.ok) throw new Error((res && res.error) || 'Could not load guest list.');
  // The updated script answers with the event it read. The old script ignores the event
  // and returns the same list for every tab — stop and explain instead of showing wrong data.
  if (res.event !== event) throw Object.assign(new Error('Your Google Apps Script is still the OLD version, so it cannot separate the lists. In the Sheet: Extensions → Apps Script → paste the new Google_Apps_Script.gs → Save → run "setup" → Deploy → Manage deployments → Edit → Version: New version → Deploy. Then reload this page.'), { oldScript: true });
  cache[event] = res.rows || [];
}

const sum = (list, k) => list.reduce((a, r) => a + (Number(r[k]) || 0), 0);
function fmtDate(iso) { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function stat(label, value) { return `<div class="stat"><span>${label}</span><b>${value}</b></div>`; }

function render() {
  const rows = cache[current] || [];
  const yes = rows.filter(r => r.attending === 'Yes'), no = rows.filter(r => r.attending === 'No');
  $('stats').innerHTML = current === 'mehendi'
    ? stat('Ladies attending', sum(yes, 'ladies')) + stat('Gents attending', sum(yes, 'gents')) + stat('Total attending', sum(yes, 'guests')) + stat('Accepted / declined', yes.length + ' / ' + no.length)
    : stat('People attending', sum(yes, 'guests')) + stat('Accepted', yes.length) + stat('Declined', no.length) + stat('Total responses', rows.length)
      + stat('Reception total (both cards)', ['reception', 'mehvash_raju'].reduce((a, ev) => a + sum((cache[ev] || []).filter(r => r.attending === 'Yes'), 'guests'), 0));

  const cols = COLUMNS[current];
  if (!cols.some(c => c[0] === sortKey)) { sortKey = 'receivedAt'; sortDir = -1; }
  $('head').innerHTML = '<tr>' + cols.map(([k, label, num]) => `<th data-k="${k}"${num ? ' class="num"' : ''}>${label}${k === sortKey ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  $('head').querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); }));

  const q = $('search').value.trim().toLowerCase(), f = $('filter').value;
  const list = rows
    .filter(r => (!f || r.attending === f) && (!q || String(r.name).toLowerCase().includes(q)))
    .sort((a, b) => { const x = a[sortKey], y = b[sortKey]; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir; });

  $('rows').innerHTML = list.length ? list.map(r => '<tr>' + cols.map(([k, , num]) =>
      k === 'receivedAt' ? `<td>${esc(fmtDate(r[k]))}</td>`
      : k === 'attending' ? `<td><span class="pill ${r[k] === 'Yes' ? 'Yes' : 'No'}">${r[k] === 'Yes' ? 'Yes' : 'No'}</span></td>`
      : `<td${num ? ' class="num"' : ''}>${esc(r[k])}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}" class="empty">${rows.length ? 'No guests match.' : 'No RSVPs yet.'}</td></tr>`;

  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.event === current)));
  $('dashMsg').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function downloadCsv() {
  const cols = COLUMNS[current];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(c => q(c[1])).join(',')].concat((cache[current] || []).map(r => cols.map(c => q(r[c[0]])).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = current + '-rsvps.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function login(key, silent) {
  $('loginBtn').disabled = true; $('loginMsg').className = 'msg'; $('loginMsg').textContent = 'Loading…';
  try {
    await Promise.all(EVENTS.map(ev => load(ev, key)));
    hostKey = key;
    try { if ($('remember').checked || silent) localStorage.setItem(KEY_STORE, key); } catch (_) {}
    $('loginBox').hidden = true; $('dash').hidden = false; $('loginMsg').textContent = '';
    render();
  } catch (err) {
    if (!err.oldScript) { try { localStorage.removeItem(KEY_STORE); } catch (_) {} }
    $('loginMsg').className = 'msg error'; $('loginMsg').textContent = err.message;
  } finally { $('loginBtn').disabled = false; }
}

if (!/\/exec$/.test(endpoint)) { $('loginMsg').className = 'msg error'; $('loginMsg').textContent = 'js/config.js has no /exec link yet.'; }

$('loginForm').addEventListener('submit', e => { e.preventDefault(); login($('hostKey').value.trim(), false); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { current = b.dataset.event; render(); }));
$('search').addEventListener('input', render);
$('filter').addEventListener('change', render);
$('csv').addEventListener('click', downloadCsv);
$('refresh').addEventListener('click', async () => { $('dashMsg').textContent = 'Refreshing…'; try { await load(current, hostKey); render(); } catch (e) { $('dashMsg').textContent = e.message; } });
$('logout').addEventListener('click', () => { try { localStorage.removeItem(KEY_STORE); } catch (_) {} hostKey = ''; $('dash').hidden = true; $('loginBox').hidden = false; $('hostKey').value = ''; });

try { const saved = localStorage.getItem(KEY_STORE); if (saved) { $('remember').checked = true; login(saved, true); } } catch (_) {}
})();
</script>
</body>
</html>
